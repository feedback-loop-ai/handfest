name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - run: rustup target add thumbv7em-none-eabihf
      - run: cargo fmt --all -- --check
      - run: cargo check -p handfest-core --no-default-features --locked
      - run: cargo check -p handfest-core --no-default-features --locked --target thumbv7em-none-eabihf
      - run: cargo clippy -p handfest-core --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test -p handfest-core --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: bash plugins/tests/test-hooks.sh
