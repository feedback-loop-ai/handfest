[package]
name = "handfest-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference CLI for formatting, signing, narrowing, verifying, and auditing handfest mandates"

[[bin]]
name = "handfest"
path = "src/main.rs"

[features]
default = []
witness-ots = ["handfest-ledger/witness-ots"]

[dependencies]
handfest-core.workspace = true
handfest-anchors.workspace = true
handfest-ledger.workspace = true
handfest-approver.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
