[package]
name = "handfest-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-new-dependency CLI Policy Enforcement Point wrapping arbitrary executables under HANDFEST v1 mandates"

[[bin]]
name = "handfest-exec"
path = "src/main.rs"

[dependencies]
handfest-core.workspace = true    # internal workspace crate: AST, exact JSON, lossless decimals, gate, receipts
handfest-anchors.workspace = true # internal workspace crate: AnchorRegistry, SignedMandate, SignedRevocation
handfest-ledger.workspace = true  # internal workspace crate: ReceiptLedger trait and SQLite ledger
handfest-pep.workspace = true     # internal workspace crate: shared GateEngine, Clock, CredentialSource, chain verification
clap.workspace = true             # CLI argument parsing for `handfest-exec` binary (prototyping debt)
serde.workspace = true            # typed config serialization/deserialization for CliPolicyMap schema (prototyping debt)

[dev-dependencies]
serde_json.workspace = true       # test-only JSON fixture serialization/deserialization
tempfile.workspace = true         # test-only ephemeral directories for SQLite ledger, secret files, and subprocess tests

[lints]
workspace = true
